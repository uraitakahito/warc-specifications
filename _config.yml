baseurl: /warc-specifications

markdown: kramdown

permalink: pretty

# 閲覧・編集のリンクの先は fork。上流（課題のラベルと足元の文）は upstream_repository
github_repository: https://github.com/uraitakahito/warc-specifications
upstream_repository: https://github.com/iipc/warc-specifications
reference_branch: master

defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
    values:
      layout: "default"
      # 頁の言語。日本語の頁は front matter で lang: ja と書く
      lang: "en"

exclude:
- "*/Makefile"
# 訳の検査と決まりの文書は、サイトに出さない
- scripts
- package.json
- TRANSLATING.ja.md

plugins:
  - jekyll-redirect-from

