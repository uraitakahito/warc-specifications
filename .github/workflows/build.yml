# GitHub Pages と同じ組み立て（actions/jekyll-build-pages）で _site を建て、検査し、
# master では、その _site をそのまま Pages に配る。
#
# Pages の設定は「GitHub Actions」（build_type: workflow）。PR で確かめた組み立てと、配る組み立てが
# 同じ物になる。PR の _site は成果物 site として残るので、`gh run download` で落とし、
# serve/warc-specifications/ の下に置いて開けば baseurl のとおりに見える。
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 訳の検査が source_commit を引くので、全履歴を取る
          fetch-depth: 0
      - name: GitHub Pages と同じ組み立てで建てる
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: 建てた _site を成果物にする
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          retention-days: 14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 検査の試験
        run: npm test
      - name: 日本語の頁を、元の英語の頁と並べて検査する（scripts/check-ja.mjs）
        run: npm run check
      - name: Pages に配る形にする（master だけ。検査が緑のときだけここに来る）
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Pages に配る
        id: deployment
        uses: actions/deploy-pages@v5
